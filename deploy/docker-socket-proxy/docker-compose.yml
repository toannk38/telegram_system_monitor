# Read-only Docker API proxy for the systemd deployment.
# The bot (running on the host) connects with DOCKER_API_URL=tcp://127.0.0.1:2375.
#
#   docker compose -f deploy/docker-socket-proxy/docker-compose.yml up -d
#
# Bound to 127.0.0.1 only. Only GET /containers/* is allowed.
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: system-monitor-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
