[project]
name = "system-monitor"
version = "0.2.0"
description = "System monitor (CPU/RAM/Disk/Temp) with Telegram bot alerts"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "docker>=7.2.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
